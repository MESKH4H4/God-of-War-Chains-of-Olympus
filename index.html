<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOW: Chains of Olympus HD - Comparison Hub</title>
    
    <script defer src="https://unpkg.com/img-comparison-slider@7/dist/index.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/img-comparison-slider@7/dist/styles.css" />

    <style>
        :root {
            --gow-red: #8b0000;
            --gow-gold: #c5a059;
            --dark-bg: #050505;
            --card-bg: #121212;
            --text-gray: #888;
        }

        body { 
            font-family: 'Times New Roman', serif; 
            background-color: var(--dark-bg); 
            color: #e0e0e0; 
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-image: radial-gradient(circle at center, #1a0000 0%, #050505 100%);
        }

        .container { max-width: 1100px; width: 100%; text-align: center; }

        header { 
            padding: 30px 0; 
            margin-bottom: 20px; 
            border-bottom: 2px solid var(--gow-red);
            box-shadow: 0 10px 20px rgba(139, 0, 0, 0.2);
        }
        
        h1 { 
            color: var(--gow-gold); 
            margin: 0; 
            font-size: 2.5rem; 
            text-transform: uppercase; 
            letter-spacing: 4px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        .category-menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .btn-cat {
            background: #1a1a1a;
            border: 1px solid #333;
            color: var(--gow-gold);
            padding: 15px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.4s;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.8rem;
        }

        .btn-cat.active {
            border-color: var(--gow-red);
            background: var(--gow-red);
            color: white;
        }

        .image-selector {
            margin: 20px 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .btn-img {
            width: 45px;
            height: 45px;
            border: 1px solid var(--gow-gold);
            background: transparent;
            color: var(--gow-gold);
            cursor: pointer;
            transition: 0.3s;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        }

        .btn-img.active {
            background: var(--gow-gold);
            color: black;
            transform: scale(1.1);
        }

        .comparison-area {
            background: var(--card-bg);
            padding: 5px;
            border: 1px solid #222;
            box-shadow: 0 0 40px rgba(0,0,0,1);
        }

        img-comparison-slider {
            width: 100%;
            --divider-color: var(--gow-red);
            --default-handle-color: var(--gow-red);
        }

        img-comparison-slider img {
            width: 100%;
            max-height: 75vh;
            object-fit: contain;
            display: block;
        }

        .label-box {
            display: flex;
            justify-content: space-between;
            padding: 15px;
            font-weight: bold;
            color: var(--gow-gold);
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        footer { margin-top: 60px; color: #444; font-size: 0.75rem; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>GOW: Chains of Olympus HD</h1>
            <p style="color: var(--text-gray); text-transform: uppercase; font-size: 0.8rem;">Interface de Comparação</p>
        </header>

        <div class="category-menu">
            <button class="btn-cat active" onclick="setCategory('psp_vs_ktx2', this)">PSP vs PS3 AI Upscale</button>
            <button class="btn-cat" onclick="setCategory('ktx2_vs_color', this)">Normal vs Vivid Colors</button>
            <button class="btn-cat" onclick="setCategory('png_vs_ktx2', this)">PNG vs KTX2 Performance</button>
        </div>

        <div class="image-selector" id="imgSelector"></div>

        <div class="comparison-area">
            <div class="label-box">
                <span id="label-left">Original</span>
                <span id="label-right">HD</span>
            </div>
            
            <img-comparison-slider id="slider">
                <img slot="first" id="img-before" src="" />
                <img slot="second" id="img-after" src="" />
            </img-comparison-slider>
        </div>

        <footer>
            PROJETO DESENVOLVIDO POR MESKH4H4 | GOD OF WAR HD 2026
        </footer>
    </div>

    <script>
        const baseUrl = "https://meskh4h4.github.io/God-of-War-Chains-of-Olympus/comparacoes";
        
        let currentCategory = 'psp_vs_ktx2';
        let currentIndex = 0;

        const configs = {
            'psp_vs_ktx2': {
                leftDir: 'PSP/psp-4x',
                rightDir: 'KTX2/ktx2-opt',
                labelL: 'PSP Original',
                labelR: 'PS3 HD AI'
            },
            'ktx2_vs_color': {
                leftDir: 'KTX2/ktx2-opt',
                rightDir: 'VIVID/vivid-hd',
                labelL: 'HD Padrão',
                labelR: 'HD Vivid'
            },
            'png_vs_ktx2': {
                leftDir: 'PS3-AI/png-hd',
                rightDir: 'KTX2/ktx2-opt',
                labelL: 'PNG (Original)',
                labelR: 'KTX2 (Otimizado)'
            }
        };

        function initSelector() {
            const selector = document.getElementById('imgSelector');
            selector.innerHTML = ''; // Limpa antes de criar
            // Alterado para 7 (total 8 imagens: 0 a 7)
            for (let i = 0; i <= 7; i++) {
                const btn = document.createElement('button');
                btn.innerText = i;
                btn.className = 'btn-img' + (i === currentIndex ? ' active' : '');
                btn.onclick = () => setIndex(i, btn);
                selector.appendChild(btn);
            }
        }

        function setCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.btn-cat').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            updateImages();
        }

        function setIndex(idx, btn) {
            currentIndex = idx;
            document.querySelectorAll('.btn-img').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            updateImages();
        }

        function updateImages() {
            const config = configs[currentCategory];
            const imgBefore = document.getElementById('img-before');
            const imgAfter = document.getElementById('img-after');
            
            // Adicionado t=${new Date().getTime()} para evitar bugs de cache
            const cacheBuster = `?t=${new Date().getTime()}`;
            
            const newSrcBefore = `${baseUrl}/${config.leftDir}-${currentIndex}.png${cacheBuster}`;
            const newSrcAfter = `${baseUrl}/${config.rightDir}-${currentIndex}.png${cacheBuster}`;

            imgBefore.src = newSrcBefore;
            imgAfter.src = newSrcAfter;

            document.getElementById('label-left').innerText = config.labelL;
            document.getElementById('label-right').innerText = config.labelR;
        }

        initSelector();
        updateImages();
    </script>
</body>
</html>
